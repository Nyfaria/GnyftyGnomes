plugins {
    id 'multiloader-loader'
    alias(nyfs.plugins.mdg.loader)
    alias(nyfs.plugins.regutils.loader)
    id 'multiloader-moddev'
    id("com.nyfaria.moddingtools.dependencies")
    id("com.nyfaria.moddingtools.publishing")
}

neoForge {
    runs {
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', rootProject.project(":common").file('src/generated/resources/').getAbsolutePath(), '--existing', rootProject.project(":common").file('src/main/resources/').getAbsolutePath()
        }
    }
}

dependencies {
    modDeps.requiredMod(nyfs.geckolib.neoforge, "geckolib", null)
    modDeps.requiredMod(nyfs.sbl.neoforge, "smartbrainlib", null)
}
